{% extends 'blog/base.html' %}

{% block title %}Детали книги{% endblock %}

{% block content %}
{% include 'blog/header.html' %}
<h2>{{ blog.title }}</h2>
<p>Дата публикации: {{ blog.created_at|date:"d M Y" }}</p>
<a href="{% url 'blog_edit' blog.pk %}" class="btn btn-secondary">Редактировать</a>
<a href="{% url 'blog_delete' blog.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'blog_list' %}" class="btn btn-primary">Вернуться к списку</a>
{% endblock %}
