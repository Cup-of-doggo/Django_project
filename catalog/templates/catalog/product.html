{% extends 'library/base.html' %}

{% block title %}Детали книги{% endblock %}

{% block content %}
{% include 'library/header.html' %}
<h2>{{ book.title }}</h2>
<p>Название продукта: {{ product_name }}</p>
<p>Описание продукта: {{ description }}</p>
<a href="{% url 'book_edit' book.pk %}" class="btn btn-secondary">Редактировать</a>
<a href="{% url 'book_delete' book.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'books_list' %}" class="btn btn-primary">Вернуться к списку</a>
{% endblock %}
